# Lefthook configuration — https://lefthook.dev/configuration/
#
# Hooks run automatically on the relevant git command (commit, pull, checkout).
# To skip commit-msg/pre-commit in an emergency: git commit --no-verify.
# To skip any hook (e.g. post-merge/post-checkout): LEFTHOOK=0 <git command>.

pre-commit:
  parallel: false
  commands:
    format:
      glob: "*.{js,jsx,ts,tsx,css,scss,json,md,yml,yaml}"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{js,jsx,ts,tsx}"
      run: pnpm exec eslint --no-warn-ignored {staged_files}

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

# Auto-install deps after `git pull` (post-merge) or switching branches
# (post-checkout), but only when package.json/pnpm-lock.yaml actually changed.
post-merge:
  commands:
    install:
      glob: "{package.json,pnpm-lock.yaml}"
      files: git diff-tree -r --name-only --no-commit-id ORIG_HEAD HEAD
      run: pnpm install

post-checkout:
  commands:
    install:
      run: git diff-tree -r --name-only --no-commit-id {1} {2} | grep -qE '^(package\.json|pnpm-lock\.yaml)$' && pnpm install || true

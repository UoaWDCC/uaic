name: Build & Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lint:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm build
        env:
          DATABASE_URI: mongodb://127.0.0.1:27017/uaic-ci
          PAYLOAD_SECRET: ci-build-placeholder-secret
          GOOGLE_CLIENT_ID: ci-build-placeholder-client-id
          GOOGLE_CLIENT_SECRET: ci-build-placeholder-client-secret
          BETTER_AUTH_SECRET: ci-build-placeholder-auth-secret
          STRIPE_SECRET_KEY: sk_test_ci-build-placeholder
          NEXT_PUBLIC_STRIPE_PUBLIC_KEY: pk_test_ci-build-placeholder
          RESEND_API_KEY: ci-build-placeholder-resend-key

      - name: Lint
        run: pnpm lint

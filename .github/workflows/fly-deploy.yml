# Deploys the Fly.io backup host (app uaic-prod). Production runs on Vercel;
# Fly is a cold backup, so this only runs by hand: Actions -> Fly Deploy ->
# Run workflow. See docs/fly-backup.md before running it - deploying alone
# doesn't put Fly in front of the domain.
# https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
